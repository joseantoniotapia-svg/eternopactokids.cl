<title>Eterno Pacto Kids</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* Layout: app de una columna (máx 760px), cabecera fija arriba y barra de pestañas abajo, como app de celular */
:root{
  --bg:#F1F4FA; --surface:#FFFFFF; --sunk:#E7ECF6; --ink:#1A2240; --muted:#59627F; --line:#D9E0EE;
  --accent:#2B58C9; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --sun:#E9A912; --sun-soft:#FFF1CC; --sun-ink:#5A3F00;
  --leaf:#2F8A50; --leaf-soft:#DEF2E5; --rose:#C8443F; --rose-soft:#FBE3E2;
  --frame:#B98A2E; --mat:#FBF8F1;
  --c1:#2B58C9; --c2:#2F8A50; --c3:#C8443F; --c4:#8A4FC4; --c5:#C27612; --c6:#13858F;
  --p-sara:#D23A75; --p-simon:#3A62C9; --p-santiago:#B07A12; --p-maria:#C93A6E; --p-mateo:#2156B8;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1328; --surface:#181E3B; --sunk:#121731; --ink:#E7EBF8; --muted:#A3ACC8; --line:#2A3260;
  --accent:#86A5FF; --accent-ink:#0D1330; --accent-soft:#222C5A;
  --sun:#F4C451; --sun-soft:#3A3118; --sun-ink:#FBE2A0;
  --leaf:#6BCB8E; --leaf-soft:#173325; --rose:#FF8D88; --rose-soft:#3B1D22;
  --frame:#C9A04A; --mat:#1F2546; --p-sara:#FF80AE; --p-simon:#90AEFF; --p-santiago:#F0C055; --p-maria:#FF86B2; --p-mateo:#86A9FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1328; --surface:#181E3B; --sunk:#121731; --ink:#E7EBF8; --muted:#A3ACC8; --line:#2A3260;
  --accent:#86A5FF; --accent-ink:#0D1330; --accent-soft:#222C5A;
  --sun:#F4C451; --sun-soft:#3A3118; --sun-ink:#FBE2A0;
  --leaf:#6BCB8E; --leaf-soft:#173325; --rose:#FF8D88; --rose-soft:#3B1D22;
  --frame:#C9A04A; --mat:#1F2546; --p-sara:#FF80AE; --p-simon:#90AEFF; --p-santiago:#F0C055; --p-maria:#FF86B2; --p-mateo:#86A9FF; color-scheme:dark}

html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{width:68px;height:40px;flex:none;border-radius:8px;object-fit:cover;background:#16204a}
.guia{display:flex;align-items:flex-end;gap:12px}
.guia img{width:76px;height:76px;border-radius:50%;flex:none;object-fit:cover;border:3px solid var(--pc,var(--accent));background:var(--sunk)}
.bubble{position:relative;background:var(--surface);border:2px solid var(--pc,var(--accent));border-radius:18px 18px 18px 4px;padding:10px 14px;min-width:0;flex:1}
.bubble b{font-family:var(--display);font-weight:600;color:var(--pc,var(--accent));display:block;font-size:.95rem}
.bubble p{font-size:.95rem}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.char{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.char img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--pc)}
.char b{font-family:var(--display);font-weight:600;font-size:1.15rem;color:var(--pc)}
.char span{font-size:.8rem;color:var(--muted)}
.poster{max-width:420px;width:100%;align-self:center;border-radius:14px;display:block;aspect-ratio:2/3;object-fit:cover;background:var(--sunk)}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.trait{background:var(--sunk);border-radius:12px;padding:10px 12px}
.trait b{display:block;font-family:var(--display);font-weight:600;color:var(--pc)}
.letter{background:var(--mat);border:1px solid var(--line);border-radius:6px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;max-width:680px}
.letter h2{text-align:center;font-size:1.4rem}
.letter ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.letter li{display:flex;gap:10px;align-items:flex-start}
.letter li::before{content:"";flex:none;width:10px;height:10px;margin-top:7px;border-radius:50%;background:var(--sun)}
.letter .vers{border-left:4px solid var(--sun);padding-left:12px;font-style:italic}
.letter .firma{font-family:var(--display);font-weight:600;font-size:1.15rem;text-align:right}
.stamp{align-self:flex-end;border:2px solid var(--leaf);color:var(--leaf);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;transform:rotate(-3deg)}
.brand{min-width:0;flex:1}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:600;display:block;line-height:1.1}
.brand span{color:var(--muted);font-size:.85rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;white-space:nowrap}
.mode[data-on="familia"]{background:var(--sun-soft);border-color:var(--sun);color:var(--sun-ink)}

main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 9px;color:var(--muted);font-size:.7rem;font-weight:700;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{background:var(--accent-soft);border-radius:999px;padding:2px 8px;width:42px;box-sizing:border-box}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:1.35rem}

.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--rose-soft);color:var(--rose)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.link-btn{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:0;display:inline-flex;gap:4px;align-items:center;align-self:flex-start}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.hero .eyebrow{color:inherit;opacity:.85}
.hero h1{font-size:clamp(1.6rem,6vw,2.2rem);max-width:22ch}
.hero .cita{font-weight:700;opacity:.9}
.hero p{max-width:60ch}
.hero .btn{background:var(--accent-ink);color:var(--accent);align-self:flex-start;margin-top:6px}
.hero svg.sprout{position:absolute;right:-6px;bottom:-8px;width:120px;height:120px;opacity:.18}

.verse{background:var(--sun-soft);border:2px dashed var(--sun);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px}
.verse .eyebrow{color:var(--sun-ink)}
.verse blockquote{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(1.25rem,4.6vw,1.6rem);line-height:1.3;max-width:34ch}
.verse cite{font-style:normal;font-weight:700;color:var(--sun-ink)}

.empty{border:2px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:left;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty h3{font-size:1.15rem}

.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-width:0}
button.item:hover{border-color:var(--accent)}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block}
.datechip{flex:none;width:52px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 0;font-family:var(--display);line-height:1.05}
.datechip b{font-size:1.35rem;display:block}
.datechip span{font-size:.72rem;font-weight:600;text-transform:uppercase}
.datechip.past{background:var(--sunk);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.sun{background:var(--sun-soft);color:var(--sun-ink)}
.post.pend{border-style:dashed;opacity:.85}
.item.mia{background:var(--sun-soft)}
.thumb{flex:none;width:58px;height:76px;object-fit:cover;object-position:top;border-radius:8px 4px 8px 8px;border:2px solid var(--edge,var(--line));background:#fff;box-shadow:2px 2px 0 var(--edge,transparent)}
.thumb-w{position:relative;flex:none;display:block}.thumb-ok{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;border:2px solid var(--surface)}
.res.bloq .thumb{filter:grayscale(.7) blur(.6px)}
.aviso-nueva{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(120deg,#FFD23F,#FF7A1A 70%,#FF3D8B);color:#1E1548;border:2.5px solid var(--edge,#2A1E5C);box-shadow:5px 5px 0 var(--edge,#2A1E5C);border-radius:26px 10px 28px 16px;padding:14px 16px;transform:rotate(-.8deg)}
.an-star{flex:none;width:52px;height:52px;display:grid;place-items:center;font-size:1.8rem;color:#fff;background:#5B3DF5;border:2.5px solid var(--edge,#2A1E5C);border-radius:50% 40% 55% 45%;transform:rotate(-10deg)}
.an-txt{flex:1;min-width:180px}.an-eti{font-family:var(--display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em}
.an-txt h2{font-size:1.35rem;line-height:1.15}.an-txt p:last-child{font-weight:700;font-size:.9rem}
.an-acts{display:flex;align-items:center;gap:8px}.an-acts .btn{background:#fff;color:#1E1548}
.an-x{position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;border:2px solid var(--edge,#2A1E5C);background:#fff;color:#1E1548;font-weight:700;display:grid;place-items:center}
.tab{position:relative}.tab-dot{position:absolute;top:5px;right:calc(50% - 18px);width:11px;height:11px;border-radius:50%;background:#FF3D8B;border:2px solid var(--surface)}
@media (prefers-reduced-motion:no-preference){.an-star{animation:brillo 1.6s ease-in-out infinite}@keyframes brillo{50%{transform:rotate(8deg) scale(1.1)}}}
.pill.lock{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.res.bloq{opacity:.72}
.pill.leaf{background:var(--leaf-soft);color:var(--leaf)}

.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:600;font-size:1.1rem}
.avatar.lg{width:64px;height:64px;font-size:1.7rem}
.stars{font-family:var(--display);font-weight:600;font-size:1.15rem;display:inline-flex;align-items:center;gap:4px;color:var(--sun-ink);font-variant-numeric:tabular-nums}
.stars svg{width:18px;height:18px;fill:var(--sun)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.rank{font-family:var(--display);font-weight:600;width:22px;text-align:center;color:var(--muted);flex:none}

.reg{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.reg table{border-collapse:collapse;width:100%;min-width:480px}
.reg th,.reg td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:.9rem}
.reg th:first-child,.reg td:first-child{text-align:left}
.reg tr:last-child td{border-bottom:0}
.reg th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tog{width:40px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);display:inline-grid;place-items:center}
.tog svg{width:18px;height:18px;opacity:.25}
.tog[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf)}
.tog[aria-pressed="true"] svg{opacity:1;stroke:var(--surface)}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--sunk);border-radius:12px;min-width:0}
.stat b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.materials a{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:700;word-break:break-word}
.materials a:last-child{border-bottom:0}

.prizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prize{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.prize b{font-family:var(--display);font-weight:600;font-size:1.05rem}

.museum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.frame{background:var(--frame);padding:7px;border-radius:4px;border:0;box-shadow:0 2px 0 rgba(0,0,0,.18);text-align:center;display:block;width:100%}
.frame .mat{background:var(--mat);padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
.frame .art{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.frame .art svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.frame b{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.2;color:var(--ink)}
.frame span{font-size:.78rem;color:var(--muted)}
.plaque{background:var(--sunk);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.post.dest{border-color:var(--sun);background:var(--sun-soft)}
.post p{white-space:pre-wrap;word-break:break-word}
.copy{background:var(--sunk);border:0;border-radius:8px;padding:4px 10px;font-size:.8rem;font-weight:700}
.sel{user-select:all;font-variant-numeric:tabular-nums;word-break:break-all}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.9rem}
.banner{background:var(--rose-soft);color:var(--rose);border-radius:12px;padding:12px 14px;font-weight:700}

.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,14,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-size:1.3rem}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;font-size:.9rem}
.field small{color:var(--muted)}
.field input,.field textarea,.field select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.numchip{flex:none;min-width:44px;height:44px;border-radius:12px;background:var(--sun-soft);color:var(--sun-ink);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums;padding:0 6px}
.item.res{flex-wrap:wrap}
.item.res .acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.search{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;width:100%}
.prog{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--leaf)}
.libro td{vertical-align:middle}
.libro input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.libro input.nota{width:64px;text-align:center;font-variant-numeric:tabular-nums}
.libro input.obs{width:100%;min-width:180px}
.libro select,.selclase{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.nota-baja{color:var(--rose);font-weight:700}
.fav{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--hl,var(--sun));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fav p{font-family:var(--display);font-weight:500;font-size:1.1rem;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.pj-card .fig{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);height:150px;max-width:118%;object-fit:contain;object-position:bottom;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.25))}
.pj-card b{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.1;position:relative}
.pj-card span{font-size:.78rem;font-weight:700;opacity:.95;position:relative;line-height:1.25}
.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:30px 16px;padding-top:34px}
.pj-card.big{width:auto;padding-top:168px}
.pj-card.big .pj-blob{height:140px}
.pj-card.big .fig{height:208px;bottom:auto;top:-30px}
.pj-leer{margin-top:6px;background:rgba(255,255,255,.9);color:var(--edge)!important;align-self:flex-start;border-radius:999px;padding:3px 10px;border:2px solid var(--edge)}

/* ficha de un personaje */
.pj-hero{position:relative;display:grid;grid-template-columns:minmax(120px,42%) 1fr;align-items:end;gap:6px;background:var(--pc);color:#fff;border:var(--bd);box-shadow:6px 6px 0 var(--edge);border-radius:36px 14px 40px 20px;padding:18px 18px 0;overflow:hidden;margin-top:6px}
.pj-hero .pj-blob{position:absolute;left:-30px;bottom:-40px;width:62%;aspect-ratio:1;border-radius:46% 54% 42% 58%/55% 45% 55% 45%;background:rgba(255,255,255,.25)}
.pj-hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--pop-yellow);opacity:.45}
.pj-full{position:relative;z-index:1;max-height:330px;width:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.25))}
.pj-txt{position:relative;z-index:1;padding-bottom:22px;display:flex;flex-direction:column;gap:6px}
.pj-txt .eyebrow{color:#fff;opacity:.9}
.pj-txt h1{font-size:clamp(2.3rem,10vw,3.6rem);line-height:.95;text-shadow:3px 3px 0 var(--edge)}
.pj-tit{font-family:var(--display);font-weight:600;font-size:1.15rem;background:#fff;color:var(--edge);align-self:flex-start;padding:2px 12px;border-radius:12px 4px 12px 12px;transform:rotate(-2deg);border:2px solid var(--edge)}
.pj-frase{font-weight:700;font-size:1.02rem}
.pj-rasgos{display:flex;flex-wrap:wrap;gap:10px;padding:4px}
.rasgo{background:var(--surface);border:2px solid var(--edge);box-shadow:var(--sh-sm);border-radius:16px 6px 18px 12px;padding:8px 12px;transform:rotate(var(--rot,0deg));max-width:250px}
.rasgo b{display:block;font-family:var(--display);font-weight:600;color:var(--pc);font-size:1.05rem}
.rasgo span{font-size:.85rem}
.historia{background:var(--surface);padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.historia h2{font-size:1.6rem;color:var(--pc)}
.historia p{font-size:1.08rem;line-height:1.65;max-width:62ch}
.historia p.h-p1::first-letter{font-family:var(--display);font-weight:600;font-size:3.1em;float:left;line-height:.85;margin:6px 8px 0 0;color:var(--pc)}
.oir-h{align-self:flex-start;background:var(--pc)}
.h-verso{margin:4px 0;background:var(--pop-yellow);color:#1E1548;border:2px solid var(--edge);border-radius:8px 22px 10px 20px;padding:14px 16px;font-family:var(--display);font-weight:500;font-size:1.2rem;transform:rotate(-.8deg)}
.h-verso cite{display:block;font-style:normal;font-weight:700;font-size:.95rem;margin-top:4px}
.h-preg{border:2px dashed var(--pc);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.h-preg b{font-family:var(--display);font-weight:600;color:var(--pc)}
.pj-afiche summary{cursor:pointer;font-family:var(--display);font-weight:600;color:var(--accent);padding:6px 0}
.pj-afiche img{display:block;width:100%;max-width:420px;height:auto;margin:8px auto 0;border:var(--bd);border-radius:20px;box-shadow:var(--sh)}

/* insignias con personajes de cuerpo entero */
.medal{width:92px;height:108px;border-radius:44% 56% 30px 30px/40% 40% 30px 30px;padding:0;background:var(--pc);border:2px solid var(--edge);display:grid;place-items:end center;overflow:hidden}
.medal img{width:100%;height:104%;border:0;border-radius:0;object-fit:contain;object-position:bottom}
.badge.off .medal{background:var(--sunk)}
.cel-fig{height:180px;width:auto;object-fit:contain;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.2))}

/* pantalla de ingreso */
#acceso{background:linear-gradient(150deg,var(--pop-violet) 0%,var(--pop-pink) 55%,var(--pop-orange) 100%)}
.ac-card{border:var(--bd);box-shadow:6px 6px 0 var(--edge);border-radius:28px 12px 30px 18px}
.ac-grupo{width:100%;border-radius:28px 12px 32px 16px;border:var(--bd);box-shadow:6px 6px 0 var(--edge);transform:rotate(-1.5deg)}
.ac-logo{width:120px;height:auto;margin-bottom:-36px;position:relative;z-index:1;transform:rotate(-6deg);filter:drop-shadow(3px 3px 0 rgba(0,0,0,.3))}

@media (prefers-reduced-motion:reduce){.hero,.verse,.pj-card,.rasgo,.pandilla-foto,.h-verso,.seg button[aria-pressed="true"],.tab[aria-current="page"]{transform:none!important}}
@media (min-width:700px){.pj-full{max-height:400px}.guia-fig{width:104px;height:144px}.guia .guia-fig img{height:144px}}
</style>

const HISTORIAS={"santiago": {"titulo": "Santiago y la noche de la tormenta", "p": ["Era sábado en la noche y los amigos estaban en la casa del árbol preparando la clase del domingo. De pronto, ¡BUM!, sonó un trueno enorme y la lluvia empezó a golpear el techo.", "Sara se tapó los oídos y abrazó fuerte a Zanahoria. Simón se escondió debajo de una manta y solo se le veía la cola temblando. Hasta Mateo dejó de comer su galleta.", "Santiago respiró hondo, se sentó junto a ellos y abrió su Biblia. «¿Saben qué? Los amigos de Jesús también tuvieron miedo una vez», dijo con calma. Y les leyó cómo Jesús iba en una barca, se levantó en medio de la tormenta y le dijo al viento: «¡Calla, enmudece!». Y todo quedó en calma.", "«Pero el trueno sigue sonando», susurró Sara. Santiago sonrió: «Jesús no siempre quita la tormenta de inmediato, pero siempre está con nosotros en la barca». María tomó la mano de Sara, Mateo apoyó su cabeza en el hombro de Santiago y juntos oraron.", "Poco a poco la lluvia se volvió suave, como una canción. Simón salió de la manta, se estiró y se quedó dormido sobre la Biblia abierta. Sara ya no tenía miedo: había aprendido que la Palabra de Dios es como una linterna en la noche."], "verso": "Lámpara es a mis pies tu palabra, y lumbrera a mi camino.", "cita": "Salmo 119:105", "pregunta": "¿Qué te da miedo a ti? ¿Qué versículo podrías recordar cuando sientas miedo?"}, "maria": {"titulo": "María y el niño nuevo", "p": ["Un domingo llegó a la escuela dominical un niño que nadie conocía. Se llamaba Tomás. Se sentó en la última silla, miraba el suelo y no hablaba con nadie.", "Los demás estaban tan entretenidos con el juego de preguntas que no se dieron cuenta. Pero María sí. Ella siempre se da cuenta cuando alguien está triste, porque siente con el corazón.", "María tomó su cuaderno de dibujo y, en silencio, dibujó un árbol enorme con muchas ramas, y en cada rama un niño sonriendo. En la rama más grande escribió: «Tomás». Se acercó y le regaló el dibujo.", "«¿Por qué estoy yo en el árbol?», preguntó Tomás. «Porque en la familia de Dios hay espacio para todos, y ahora tú también eres parte de la nuestra», respondió María. Después lo invitó a su equipo. Santiago le explicó las reglas, Mateo le prestó su lupa y Sara le dejó abrazar a Zanahoria.", "Al final de la clase, Tomás estaba riendo con todos. Esa noche, María escribió en su cuaderno: «El amor también se demuestra». Y le dio gracias a Dios por su nuevo amigo."], "verso": "Amados, amémonos unos a otros; porque el amor es de Dios.", "cita": "1 Juan 4:7", "pregunta": "¿Conoces a alguien que esté solo en tu curso o en tu iglesia? ¿Cómo podrías demostrarle el amor de Dios esta semana?"}, "mateo": {"titulo": "Mateo y la semilla diminuta", "p": ["Mateo estaba agachado en el jardín con su lupa, como siempre. «¡Encontré algo!», gritó. En la palma de su mano había una semilla tan pequeña que casi no se veía.", "«¿Cómo puede algo tan chiquitito convertirse en un árbol gigante?», preguntó. Y siguió: «¿Y quién le dice a la semilla que crezca? ¿Y por qué Dios hizo las semillas tan pequeñas?». Mateo es así: una pregunta lleva a otra pregunta.", "Santiago abrió la Biblia y le mostró que Jesús habló justamente de eso: el Reino de Dios es como una semilla de mostaza, la más pequeña de todas, que crece hasta ser un árbol donde los pájaros hacen sus nidos.", "Mateo se quedó pensando mientras mordía su galleta. «Entonces… ¿la fe también puede empezar chiquitita y crecer?». «¡Exacto!», dijo María. Ese mismo día plantaron la semilla en un macetero y Mateo anotó en su libreta: «Día 1: semilla. Pregunta: ¿cuánto crecerá mi fe?».", "Cada mañana, Mateo revisaba el macetero con su lupa. Al décimo día apareció un brote verde. Mateo descubrió que hacer preguntas no es malo: cada pregunta lo ayudaba a conocer mejor a Dios."], "verso": "Clama a mí, y yo te responderé, y te enseñaré cosas grandes y ocultas que tú no conoces.", "cita": "Jeremías 33:3", "pregunta": "¿Qué pregunta te gustaría hacerle a Dios? Escríbela y conversa con tu familia o tu maestro sobre ella."}, "sara": {"titulo": "Sara y la ovejita perdida", "p": ["En un paseo al campo, Sara caminaba feliz con Zanahoria bajo el brazo y su jugo en la mano. De pronto escuchó un sonido muy suave: «Beee…».", "Detrás de unos arbustos encontró una ovejita blanca enredada entre las ramas. Estaba asustada y sola. «No tengas miedo, pequeñita», le dijo Sara con su voz más dulce. «Jesús es el Buen Pastor y no se olvida de ninguna oveja».", "Sara cerró los ojos y oró: «Señor, ayúdanos a llevarla a casa». Luego llamó a sus amigos. Santiago apartó las ramas con cuidado, Mateo encontró con su lupa las huellas que llevaban al corral, María acarició a la ovejita para calmarla y Simón saltó adelante mostrando el camino.", "Al llegar, Don Elías, el pastor, corrió a abrazar a su ovejita. «¡La busqué toda la tarde!», dijo con lágrimas de alegría. «Así de feliz se pone Jesús cuando encuentra a alguien que estaba perdido», le explicó Santiago a Sara.", "Esa noche, Sara le contó todo a Zanahoria antes de dormir: «¿Sabes? Si alguna vez me pierdo, Jesús también me va a buscar». Y se durmió sonriendo, con el corazón lleno de fe."], "verso": "Gozaos conmigo, porque he encontrado mi oveja que se había perdido.", "cita": "Lucas 15:6", "pregunta": "¿Cómo crees que se sintió la ovejita cuando la encontraron? ¿Cómo te cuida Jesús a ti?"}, "simon": {"titulo": "Simón y la travesura de Zanahoria", "p": ["Simón es un gatito que no puede quedarse quieto. Salta, trepa, da volteretas… ¡y siempre tiene una idea divertida! Ese día, su idea fue jugar con Zanahoria, el peluche favorito de Sara, sin pedirlo prestado.", "Corrió con Zanahoria en la boca, saltó a una rama, después a otra más alta, y otra más… hasta que miró hacia abajo y se dio cuenta de que estaba muy, muy alto. «¡Miau!», maulló asustado. No sabía cómo bajar.", "Sara llegó llorando: «¡Zanahoria no está!». Pero cuando vio a Simón temblando en la rama, se le olvidó el enojo. «¡Hay que function oirHistoria(k){let ss;try{ss=window.speechSynthesis;}catch(e){}if(!ss){toast("Este dispositivo no puede leer en voz alta");return;}
  if(HABLANDO){callar();render();return;}
  const h=HISTORIAS[k];const partes=[h.titulo,...h.p,h.verso,h.cita.replace(":"," versículo ")];
  const voces=ss.getVoices().filter(v=>/^es/i.test(v.lang));const voz=voces.find(v=>/es[-_](CL|419|MX|US|AR)/i.test(v.lang))||voces[0];
  HABLANDO=true;render();let i=0;
  const sig=()=>{if(!HABLANDO||i>=partes.length){if(HABLANDO){HABLANDO=false;render();}return;}
    const u=new SpeechSynthesisUtterance(partes[i++]);u.lang=voz?voz.lang:"es-ES";if(voz)u.voice=voz;u.rate=0.9;u.pitch=1.05;u.onend=sig;u.onerror=()=>{HABLANDO=false;render();};ss.speak(u);};
  sig();}
const COLORS=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];

/* ---------- utilidades ---------- */
function hoyISO(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fecha(iso){if(!iso)return null;const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);}
function fLarga(iso){const d=fecha(iso);return d?d.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"}):"";}
function fCorta(iso){const d=fecha(iso);return d?{dia:d.getDate(),mes:d.toLocaleDateString("es-CL",{month:"short"}).replace(".","")}:{dia:"–",mes:""};}
function proximoDomingo(){const d=new Date();d.setDate(d.getDate()+((7-d.getDay())%7));return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
const byNombre=(a,b)=>String(a.nombre||"").localeCompare(String(b.nombre||""),"es");
const clasesOrd=()=>[...S.clases].sort((a,b)=>(a.fecha||"")<(b.fecha||"")?1:-1);
const LSV="epk_vistas_"+(window.EPK&&EPK.user?EPK.user.id:"anon");
let VISTAS={};try{VISTAS=JSON.parse(localStorage.getItem(LSV)||"{}")||{};}catch(e){}
function marcarVista(id){if(!id||VISTAS[id])return;VISTAS[id]=hoyISO();try{localStorage.setItem(LSV,JSON.stringify(VISTAS));}catch(e){}}
function claseNueva(){const h=new Date(hoyISO()+"T12:00:00");h.setDate(h.getDate()-6);const desde=h.toISOString().slice(0,10);
  return S.clases.filter(c=>(c.fecha||"")>=desde&&!VISTAS[c.id]&&!claseOculta(c)).sort((a,b)=>a.fecha<b.fecha?-1:1)[0]||null;}
function avisoClase(){const c=claseNueva();if(!c)return "";
  return `<section class="aviso-nueva" role="status"><span class="an-star" aria-hidden="true">★</span><div class="an-txt"><p class="an-eti">¡Nueva clase disponible!</p><h2>${esc(c.titulo)}</h2><p>${esc(fLarga(c.fecha))}${c.cita?" · "+esc(c.cita):""}</p></div>
  <div class="an-acts"><button class="btn" data-act="verClase" data-id="${esc(c.id)}">Ver la clase</button><button class="an-x" data-act="cerrarAviso" data-id="${esc(c.id)}" aria-label="Cerrar aviso">✕</button></div></section>`;}
function claseActual(){const h=hoyISO();const fut=S.clases.filter(c=>(c.fecha||"")>=h).sort((a,b)=>a.fecha<b.fecha?-1:1);return fut[0]||clasesOrd()[0]||null;}
const safeUrl=u=>/^https?:\/\//i.test(String(u||"").trim())?String(u).trim():null;
function inicial(n){return esc((String(n||"?").trim()[0]||"?").toUpperCase());}
function avatar(n,lg){return `<span class="avatar${lg?" lg":""}" style="background:${colorFor(n.id)}">${inicial(n.nombre)}</span>`;}

function puntos(){
  const p={};S.ninos.forEach(n=>p[n.id]={total:0,presente:0,versiculo:0,biblia:0,tarea:0,bonos:0});
  for(const a of Object.values(S.asistencia)){for(const[k]of MARCAS){(a[k]||[]).forEach(id=>{if(p[id]){p[id].total+=PTS[k];p[id][k]++;}});}}
  S.bonos.forEach(b=>{if(p[b.ninoId]){const v=Number(b.pts)||0;p[b.ninoId].total+=v;p[b.ninoId].bonos+=v;}});
  return p;
}
function ranking(){const p=puntos();return [...S.ninos].sort(byNombre).sort((a,b)=>p[b.id].total-p[a.id].total).map(n=>({n,p:p[n.id]}));}

let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function errMsg(e){
  const c=e&&e.code;
  if(c==="invalid_argument")return "No tienes permiso para guardar cambios aquí. Pide al administrador de tu congregación que te dé el rol de maestro.";
  if(c==="quota_exceeded")return "Se llenó el espacio de datos. Borra registros antiguos para seguir guardando.";
  return "No se pudo guardar. Revisa tu conexión e inténtalo otra vez.";
}
const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn);queues[key]=p.catch(()=>{});return p;}
async function guardar(col,id,data){
  const ref=id?db.collection(col).doc(id):db.collection(col).doc();
  const clean={};for(const k in data)if(k!=="id"&&data[k]!==undefined)clean[k]=data[k];
  await enqueue(ref.path,()=>ref.set(clean));return ref.id;
}
async function borrar(col,id){const ref=db.collection(col).doc(id);await enqueue(ref.path,()=>ref.delete());}

/* ---------- formularios (hoja inferior) ---------- */
function openForm({titulo,ayuda,campos,datos={},onSave,onDelete,guardarTxt}){
  const root=$("#sheetRoot");
  const fields=campos.map(f=>{
    const v=datos[f.k]??f.def??"";const id="f_"+f.k;
    let input;
    if(f.type==="textarea")input=`<textarea id="${id}" ${f.req?"required":""} placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`;
    else if(f.type==="select")input=`<select id="${id}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(v)===String(o[0])?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
    else if(f.type==="file")input=`<input id="${id}" type="file" accept="${esc(f.accept||"")}">`;
    else input=`<input id="${id}" type="${f.type||"text"}" value="${esc(v)}" ${f.req?"required":""} placeholder="${esc(f.ph||"")}" ${f.type==="number"?'step="1"':""}>`;
    return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}${f.hint?`<small>${esc(f.hint)}</small>`:""}</div>`;
  }).join("");
  root.innerHTML=`<div class="sheet-bg" id="sheetBg"><form class="sheet" id="sheetForm" novalidate>
    <h2>${esc(titulo)}</h2>${ayuda?`<p class="muted small">${esc(ayuda)}</p>`:""}${fields}
    <p class="small" id="formErr" style="color:var(--rose)" hidden></p>
    <div class="row between"><div class="row">${onDelete?`<button type="button" class="btn danger sm" id="delBtn">Eliminar</button>`:""}</div>
    <div class="row"><button type="button" class="btn line" id="cancelBtn">Cancelar</button><button type="submit" class="btn">${esc(guardarTxt||"Guardar")}</button></div></div>
  </form></div>`;
  const close=()=>root.innerHTML="";
  $("#cancelBtn").onclick=close;
  $("#sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")close();});
  const first=root.querySelector("input,textarea,select");if(first)first.focus();
  if(onDelete){let armed=false;$("#delBtn").onclick=async()=>{
    if(!armed){armed=true;$("#delBtn").textContent="¿Seguro? Toca otra vez";return;}
    try{await onDelete();close();toast("Eliminado");}catch(e){showErr(e);}
  };}
  function showErr(e){const el=$("#formErr");el.textContent=typeof e==="string"?e:errMsg(e);el.hidden=false;}
  $("#sheetForm").addEventListener("submit",async e=>{
    e.preventDefault();const vals={};
    for(const f of campos){if(f.type==="file"){vals[f.k]=$("#f_"+f.k).files[0]||null;continue;}let v=$("#f_"+f.k).value;if(f.type==="number")v=v===""?0:Number(v);else v=String(v).trim();
      if(f.req&&(v===""||v===null)){showErr(`Completa el campo "${f.label}".`);return;}vals[f.k]=v;}
    const sb=$("#sheetForm").querySelector('button[type="submit"]');sb.disabled=true;const txt=sb.textContent;if(campos.some(f=>f.type==="file"))sb.textContent="Subiendo…";
    try{const r=await onSave(vals);if(r===false){sb.disabled=false;sb.textContent=txt;return;}close();toast("Guardado");}catch(err){sb.disabled=false;sb.textContent=txt;showErr(err);}
  });
}

/* ---------- vistas ---------- */
function emptyBox(t,msg,btn){return `<section class="empty"><h3>${esc(t)}</h3><p class="muted">${esc(msg)}</p>${btn||""}</section>`;}

function vInicio(){
  const c=claseActual();let out=avisoClase()+pandilla()+guia("sara","¡Hola! Jesús ama a los niños. Mira lo que aprenderemos este domingo y el versículo de la semana.");
  if(!c){
    out+=emptyBox("Aún no hay clases publicadas",ed()?"Agrega la lección del próximo domingo con su versículo, material y tarea. Las familias la verán aquí.":"Los maestros publicarán aquí la lección del domingo, el versículo y la tarea.",ed()?`<button class="btn" data-act="nuevaClase">Agregar la primera clase</button>`:"");
  }else{
    const prox=(c.fecha||"")>=hoyISO();
    out+=`<section class="hero">${I.sprout}<p class="eyebrow">${prox?"Próxima clase":"Última clase"} · ${esc(fLarga(c.fecha))}</p><h1>${esc(c.titulo)}</h1>${c.cita?`<p class="cita">${esc(c.cita)}</p>`:""}${c.resumen?`<p>${esc(c.resumen)}</p>`:""}<button class="btn" data-act="verClase" data-id="${esc(c.id)}">Ver la clase completa</button></section>`;
    if(c.versiculo)out+=`<section class="verse"><p class="eyebrow">Versículo para memorizar</p><blockquote>${esc(c.versiculo)}</blockquote>${c.versiculoCita?`<cite>${esc(c.versiculoCita)}</cite><button class="link-btn small" style="align-self:flex-start;color:var(--sun-ink)" data-act="leerRef" data-ref="${esc(c.versiculoCita)}">Leerlo en la Biblia ›</button>`:""}</section>`;
    const extras=[];
    if(c.tarea)extras.push(`<div class="card"><p class="eyebrow">Tarea para la casa</p><p>${esc(c.tarea)}</p></div>`);
    if(c.consideraciones)extras.push(`<div class="card"><p class="eyebrow">Consideraciones</p><p>${esc(c.consideraciones)}</p></div>`);
    if(extras.length)out+=`<div class="grid2">${extras.join("")}</div>`;
  }
  out+=tiraPersonajes();
  const r=ranking().slice(0,3);
  out+=`<section class="card"><div class="sec-h"><h2>Estrellas de la clase</h2><button class="link-btn" data-act="tab" data-tab="puntos">Ver todos</button></div>`;
  out+=r.length?`<div class="list">${r.map((x,i)=>`<button class="item" data-act="verNino" data-id="${esc(x.n.id)}"><span class="rank">${i+1}</span>${avatar(x.n)}<span class="grow"><b>${esc(x.n.nombre)}</b></span><span class="stars">${I.starFill}${x.p.total}</span></button>`).join("")}</div>`
    :`<p class="muted">${ed()?"Agrega a los niños en la pestaña Puntos para empezar a contar estrellas.":"Pronto verás aquí a los niños con más estrellas."}</p>`;
  out+=`</section>`;
  {const L=lector();out+=`<section class="card" style="--pc:var(--p-simon)"><div class="sec-h"><h2>Lee y gana insignias</h2><button class="link-btn" data-act="irInsignias">Ver insignias</button></div><p class="muted">${L?`${esc(BIB.actual)} tiene ${nK(L.insignias)} de ${INSIGNIAS.length} insignias y ha leído ${nK(L.cuentos)} cuentos.`:"Lee cuentos, historias de la Biblia y actividades para ganar insignias con Sara, Simón, Santiago, María y Mateo."}</p><div class="row"><button class="btn sm" data-act="tab" data-tab="recursos">Leer un cuento</button><button class="btn line sm" data-act="irBiblia">Leer la Biblia</button></div></section>`;}
  const dest=S.muro.filter(p=>p.destacado==="si").sort((a,b)=>(a.fecha||"")<(b.fecha||"")?1:-1)[0];
  if(dest)out+=`<article class="post dest"><p class="eyebrow">Aviso del muro</p><p>${esc(dest.texto)}</p><p class="muted small">${esc(dest.autor||"")}</p></article>`;
  return out;
}

function vClases(){
  if(ui.clase){const c=S.clases.find(x=>x.id===ui.clase);if(c)return vClase(c);ui.clase=null;}
  const h=hoyISO();const prox=S.clases.filter(c=>(c.fecha||"")>=h).sort((a,b)=>a.fecha<b.fecha?-1:1);const pas=clasesOrd().filter(c=>(c.fecha||"")<h);
  let out=guia("santiago","La sabiduría de Dios es para todos. Aquí están las lecciones de cada domingo con su material y tarea.");
  if(ed())out+=`<div class="seg" role="group" aria-label="Vista de clases"><button aria-pressed="${ui.claseSeg==="lecciones"}" data-act="claseSeg" data-k="lecciones">Lecciones</button><button aria-pressed="${ui.claseSeg==="libro"}" data-act="claseSeg" data-k="libro">Libro de clases</button></div>`;
  if(ed()&&ui.claseSeg==="libro")return out+vLibro();
  out+=`<div class="sec-h"><h2>Clases dominicales</h2>${ed()?`<button class="btn sm" data-act="nuevaClase">Nueva clase</button>`:""}</div>`;
  if(!S.clases.length)return out+emptyBox("Sin clases todavía",ed()?"Crea la primera lección: fecha, pasaje, versículo, material y tarea.":"Aquí aparecerá el calendario de lecciones.","");
  const row=(c,past)=>{const f=fCorta(c.fecha);const a=S.asistencia[c.id];const n=a&&a.presente?a.presente.length:0;
    return `<button class="item" data-act="verClase" data-id="${esc(c.id)}"><span class="datechip${past?" past":""}"><b>${f.dia}</b><span>${esc(f.mes)}</span></span><span class="grow"><b>${esc(c.titulo)}</b><span class="muted small">${pillOculta(c)} ${esc(c.cita||"")}</span></span>${past&&n?`<span class="pill leaf">${n} asistieron</span>`:""}</button>`;};
  if(prox.length)out+=`<p class="eyebrow">Próximas</p><div class="list">${prox.map(c=>row(c,false)).join("")}</div>`;
  if(pas.length)out+=`<p class="eyebrow">Anteriores</p><div class="list">${pas.map(c=>row(c,true)).join("")}</div>`;
  return out;
}

function vClase(c){
  const a=S.asistencia[c.id]||{};
  let out=`<button class="back" data-act="volver">‹ Todas las clases</button>
  <section class="card"><p class="eyebrow">${esc(fLarga(c.fecha))}</p>${pillOculta(c)}<h2 style="font-size:1.6rem">${esc(c.titulo)}</h2>${c.cita?`<p><b>${esc(c.cita)}</b></p>`:""}${c.resumen?`<p>${esc(c.resumen)}</p>`:""}
  ${ed()?`<div class="row"><button class="btn ghost sm" data-act="editClase" data-id="${esc(c.id)}">Editar clase</button></div>`:""}</section>`;
  if(c.versiculo)out+=`<section class="verse"><p class="eyebrow">Versículo para memorizar</p><blockquote>${esc(c.versiculo)}</blockquote>${c.versiculoCita?`<cite>${esc(c.versiculoCita)}</cite>`:""}</section>`;
  const mats=(c.material||[]).filter(m=>safeUrl(m.url)||m.titulo);
  if(mats.length)out+=`<section class="card"><p class="eyebrow">Material de la semana</p><div class="materials">${mats.map(m=>safeUrl(m.url)?`<a href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener noreferrer">${esc(m.titulo)} ↗</a>`:`<p>${esc(m.titulo)}</p>`).join("")}</div></section>`;
  const ligados=S.materiales.filter(m=>m.claseId===c.id).map(m=>[m,"materiales"]).concat(ed()?S.matprofes.filter(m=>m.claseId===c.id).map(m=>[m,"matprofes"]):[]);
  if(ligados.length)out+=`<section class="card"><p class="eyebrow">Descargables de esta clase</p><div class="list">${ligados.map(([m,col])=>filaMaterial(m,col)).join("")}</div></section>`;
  const ex=[];if(c.tarea)ex.push(`<div class="card"><p class="eyebrow">Tarea</p><p>${esc(c.tarea)}</p></div>`);if(c.consideraciones)ex.push(`<div class="card"><p class="eyebrow">Consideraciones</p><p>${esc(c.consideraciones)}</p></div>`);
  if(ex.length)out+=`<div class="grid2">${ex.join("")}</div>`;
  const cnt=k=>(a[k]||[]).length;
  if(ed()){
    out+=`<section class="card"><div class="sec-h"><h2>Registro del domingo</h2><span class="muted small">Asistió ${PTS.presente} · Versículo ${PTS.versiculo} · Biblia ${PTS.biblia} · Tarea ${PTS.tarea} estrellas</span></div>`;
    if(!S.ninos.length)out+=`<p class="muted">Primero agrega a los niños en la pestaña Puntos.</p>`;
    else out+=`<div class="reg"><table><thead><tr><th>Niño/a</th>${MARCAS.map(m=>`<th>${m[1]}</th>`).join("")}</tr></thead><tbody>${[...S.ninos].sort(byNombre).map(n=>`<tr><td>${esc(n.nombre)}</td>${MARCAS.map(([k,l])=>{const on=(a[k]||[]).includes(n.id);return `<td><button class="tog" aria-pressed="${on}" aria-label="${esc(l+": "+n.nombre)}" data-act="marcar" data-clase="${esc(c.id)}" data-nino="${esc(n.id)}" data-k="${k}">${I.check}</button></td>`;}).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="muted small">Asistieron ${cnt("presente")} de ${S.ninos.length} · ${cnt("versiculo")} recitaron el versículo</p>`;
    out+=`</section>`;
  }else if(cnt("presente")){
    out+=`<section class="stats"><div class="stat"><span class="muted small">Asistieron</span><b>${cnt("presente")}</b></div><div class="stat"><span class="muted small">Recitaron el versículo</span><b>${cnt("versiculo")}</b></div><div class="stat"><span class="muted small">Trajeron Biblia</span><b>${cnt("biblia")}</b></div></section>`;
  }
  return out;
}

function vPuntos(){
  if(ui.nino){const n=S.ninos.find(x=>x.id===ui.nino);if(n)return vNino(n);ui.nino=null;}
  const segP=`<div class="seg" role="group" aria-label="Puntos"><button aria-pressed="${ui.pts==="estrellas"}" data-act="ptsSeg" data-k="estrellas">Estrellas y premios</button><button aria-pressed="${ui.pts==="retos"}" data-act="ptsSeg" data-k="retos">Retos entre familias${window.EPKX&&EPKX.pendientes()?` <span class="pill sun">${EPKX.pendientes()}</span>`:""}</button></div>`;
  if(ui.pts==="retos")return guia("simon","¡Miau! ¿Quién lee más en familia? Reta a otra familia o únete a los desafíos de la congregación.")+segP+(window.EPKX?EPKX.vRetos():"");
  const r=ranking();const max=Math.max(1,...r.map(x=>x.p.total));
  let out=guia("simon","¡Miau! Aprender también puede ser divertido. Junta estrellas cada domingo y canjéalas por premios.")+segP+`<div class="sec-h"><h2>Estrellas y premios</h2>${ed()?`<button class="btn sm" data-act="nuevoNino">Agregar niño/a</button>`:""}</div>
  <div class="note">Cada domingo se ganan estrellas: asistir <b>${PTS.presente}</b>, recitar el versículo <b>${PTS.versiculo}</b>, traer la Biblia <b>${PTS.biblia}</b> y hacer la tarea <b>${PTS.tarea}</b>.</div>`;
  if(!r.length)out+=emptyBox("Aún no hay niños en la clase",ed()?"Agrega a cada niño con su nombre y apoderado. Luego marca la asistencia en cada clase.":"Los maestros agregarán a los niños de la clase.","");
  else out+=`<div class="list">${r.map((x,i)=>`<button class="item" data-act="verNino" data-id="${esc(x.n.id)}"><span class="rank">${i+1}</span>${avatar(x.n)}<span class="grow"><b>${esc(x.n.nombre)}</b><span class="bar" style="margin-top:6px"><i style="width:${Math.max(0,x.p.total)/max*100}%"></i></span></span><span class="stars">${I.starFill}${x.p.total}</span></button>`).join("")}</div>`;
  out+=`<div class="sec-h" style="margin-top:6px"><h2>Premios</h2>${ed()?`<button class="btn ghost sm" data-act="nuevoPremio">Nuevo premio</button>`:""}</div>`;
  const pr=[...S.premios].sort((a,b)=>(a.costo||0)-(b.costo||0));
  out+=pr.length?`<div class="prizes">${pr.map(p=>`<${ed()?"button":"div"} class="prize" ${ed()?`data-act="editPremio" data-id="${esc(p.id)}"`:""}><span class="stars">${I.starFill}${Number(p.costo)||0}</span><b>${esc(p.nombre)}</b>${p.desc?`<span class="muted small">${esc(p.desc)}</span>`:""}</${ed()?"button":"div"}>`).join("")}</div>`
    :`<p class="muted">${ed()?"Define premios que los niños pueden canjear con sus estrellas.":"Pronto se anunciarán los premios."}</p>`;
  return out;
}

function vNino(n){
  const p=puntos()[n.id];const totalClases=Object.keys(S.asistencia).filter(id=>S.clases.some(c=>c.id===id)).length;
  const bonos=S.bonos.filter(b=>b.ninoId===n.id).sort((a,b)=>(a.fecha||"")<(b.fecha||"")?1:-1);
  let out=`<button class="back" data-act="volver">‹ Todos los niños</button>
  <section class="card"><div class="row">${avatar(n,true)}<div class="grow" style="min-width:0;flex:1"><h2 style="font-size:1.6rem">${esc(n.nombre)}</h2>${n.apoderado?`<p class="muted small">Apoderado/a: ${esc(n.apoderado)}</p>`:""}</div><span class="stars" style="font-size:1.6rem">${I.starFill}${p.total}</span></div>
  ${ed()?`<div class="row"><button class="btn sm" data-act="bono" data-id="${esc(n.id)}">Dar estrellas</button><button class="btn line sm" data-act="editNino" data-id="${esc(n.id)}">Editar</button></div>`:""}</section>
  <section class="stats"><div class="stat"><span class="muted small">Domingos asistidos</span><b>${p.presente}${totalClases?`<span class="muted small"> / ${totalClases}</span>`:""}</b></div><div class="stat"><span class="muted small">Versículos recitados</span><b>${p.versiculo}</b></div><div class="stat"><span class="muted small">Biblia</span><b>${p.biblia}</b></div><div class="stat"><span class="muted small">Tareas</span><b>${p.tarea}</b></div></section>`;
  const pr=[...S.premios].sort((a,b)=>(a.costo||0)-(b.costo||0));
  if(pr.length)out+=`<section class="card"><p class="eyebrow">Camino a los premios</p><div class="list">${pr.map(x=>{const c=Number(x.costo)||1;const ok=p.total>=c;return `<div class="row" style="flex-wrap:nowrap"><span class="grow" style="flex:1;min-width:0"><b>${esc(x.nombre)}</b><span class="bar" style="margin-top:5px;display:block"><i style="width:${Math.min(100,Math.max(0,p.total)/c*100)}%"></i></span></span>${ok?(ed()?`<button class="btn sm" data-act="canjear" data-nino="${esc(n.id)}" data-id="${esc(x.id)}">Canjear</button>`:`<span class="pill sun">¡Alcanzado!</span>`):`<span class="pill">${p.total}/${c}</span>`}</div>`;}).join("")}</div></section>`;
  if(ed()){const obs=[];const notas=[];clasesOrd().forEach(c=>{const l=S.libro[c.id];if(!l)return;const nt=l.notas&&l.notas[n.id];if(nt!=null)notas.push(Number(nt));const o=l.obs&&l.obs[n.id];if(o||nt!=null)obs.push({c,o,nt});});
    const prom=notas.length?(notas.reduce((a,b)=>a+b,0)/notas.length):null;
    out+=`<section class="card"><div class="sec-h"><p class="eyebrow">Libro de clases (solo equipo)</p>${prom!=null?`<span class="pill ${prom<4?"":"leaf"}">Promedio ${fmtNota(prom)}</span>`:""}</div>${obs.length?`<div class="list">${obs.slice(0,12).map(x=>`<div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><span style="min-width:0"><b>${esc(x.c.titulo)}</b><span class="muted small" style="display:block">${esc(fLarga(x.c.fecha))}${x.o?" · "+esc(x.o):""}</span></span>${x.nt!=null?`<span class="pill ${Number(x.nt)<4?"":"sun"}">${fmtNota(x.nt)}</span>`:""}</div>`).join("")}</div>`:`<p class="muted small">Sin notas ni observaciones todavía.</p>`}</section>`;}
  out+=`<section class="card"><p class="eyebrow">Estrellas extra y canjes</p>${bonos.length?`<div class="list">${bonos.map(b=>`<div class="row between" style="flex-wrap:nowrap"><span style="min-width:0"><b>${esc(b.motivo)}</b><span class="muted small" style="display:block">${esc(fLarga(b.fecha))}</span></span><span class="row" style="flex-wrap:nowrap"><span class="pill ${Number(b.pts)<0?"":"sun"}">${Number(b.pts)>0?"+":""}${Number(b.pts)||0}</span>${ed()?`<button class="copy" data-act="borrarBono" data-id="${esc(b.id)}">Quitar</button>`:""}</span></div>`).join("")}</div>`:`<p class="muted small">Sin estrellas extra todavía.</p>`}</section>`;

const fmtMB=b=>b?(b>=1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB"):"";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TIPOS={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",mp4:"video/mp4",webm:"video/webm",txt:"text/plain",csv:"text/csv"};
const extDe=n=>(String(n||"").match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase()||"";
function upErr(e){const c=e&&e.code;
  if(c==="too_large")return "pesa más de 20 MB. Comprímelo o divídelo.";
  if(c==="unsupported_type")return "ese tipo de archivo no se puede subir. Guarda los Word o PowerPoint como PDF.";
  if(c==="quota_or_state")return "se llenó el espacio de archivos de la app.";
  if(c==="not_granted"||c==="capability_disabled")return "solo maestros y administradores pueden subir archivos.";
  return "no se pudo subir. Revisa la conexión e inténtalo otra vez.";}
async function miniatura(file){
  try{const ext=extDe(file.name);let src;
    if(ext==="pdf"){const lib=await pdfjs();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;const pg=await doc.getPage(1);const v0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:260/v0.width});
      const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);const cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:cx,viewport:vp}).promise;src=c;}
    else if(/^(png|jpe?g|gif|webp)$/.test(ext)){const bm=await createImageBitmap(file);const k=260/bm.width;const c=document.createElement("canvas");c.width=260;c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);src=c;}
    else return null;
    const blob=await new Promise(r=>src.toBlob(r,"image/jpeg",.78));return blob?new File([blob],"mini.jpg",{type:"image/jpeg"}):null;
  }catch(e){console.warn("miniatura",e);return null;}}
async function subirMiniatura(file){const m=await miniatura(file);if(!m)return null;try{return (await subirArchivo(m)).id;}catch(e){return null;}}
const thumbHTML=(x)=>x.thumb?`<img class="thumb" src="${esc(blobUrl(x.thumb))}" alt="" loading="lazy" width="58" height="76">`:"";
async function subirArchivo(file){
  if(!assets)throw {code:"not_granted"};
  const ext=extDe(file.name);const type=TIPOS[ext]||file.type;
  if(!TIPOS[ext])throw {code:"unsupported_type"};
  for(let i=0;i<2;i++){try{return await assets.upload(file,{type});}catch(e){if(i===0&&(e.code==="rate_limited"||e.code==="store_unavailable")){await sleep(4000);continue;}throw e;}}
}
async function descargar(asset,nombre,btn){
  if(!downloads){toast("Toca Abrir y guarda el archivo desde ahí");return;}
  let fn=String(nombre||"archivo.pdf");if(!/\.(pdf|png|jpe?g|gif|webp|mp4|webm|txt|csv)$/i.test(fn))fn+=".pdf";
  try{if(btn){btn.disabled=true;btn.textContent="Preparando…";}
    const r=await fetch(blobUrl(asset));if(!r.ok)throw {code:"missing"};const b=await r.blob();
    await downloads.save({filename:fn,data:b});toast("Descarga lista");}
  catch(e){const c=e&&e.code;if(c==="declined"){}else if(c==="missing")toast("No se encontró el archivo. Pide al maestro que lo vuelva a subir.");else if(c==="rate_limited")toast("Espera un momento y vuelve a intentarlo");else toast("No se pudo descargar aquí. Toca Abrir y guárdalo desde ahí.");}
  finally{if(btn){btn.disabled=false;btn.textContent="Descargar";}}
}

    const orig=sx.getImageData(0,0,W,H);const root=$("#fondoRoot");
    root.innerHTML=`<div class="fondo-bg"><div class="fondo"><h2>Quitar el fondo</h2><p class="muted small">Mueve la barra hasta que el fondo desaparezca (cuadritos grises) sin borrar al personaje. Funciona mejor con fondos lisos.</p>

      <div class="row between"><button class="btn line sm" id="fSin">Usar sin quitar fondo</button><div class="row"><button class="btn line" id="fCancel">Cancelar</button><button class="btn" id="fOk">Usar esta imagen</button></div></div></div></div>`;
    const cv=$("#fCanvas");const cx=cv.getContext("2d");
    // color dominante del borde
    const d0=orig.data;const cnt={};const add=(x,y)=>{const i=(y*W+x)*4;const k=(d0[i]>>4)+"-"+(d0[i+1]>>4)+"-"+(d0[i+2]>>4);cnt[k]=(cnt[k]||0)+1;};
    for(let x=0;x<W;x++){add(x,0);add(x,H-1);}for(let y=0;y<H;y++){add(0,y);add(W-1,y);}
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0].split("-").map(n=>n*16+8);
    function aplicar(tol){const out=new ImageData(new Uint8ClampedArray(d0),W,H);const d=out.data;if(tol<=0){cx.putImageData(out,0,0);return;}
      const vis=new Uint8Array(W*H);const q=new Int32Array(W*H);let h=0,t=0;
      const dist=i=>Math.abs(d[i]-top[0])+Math.abs(d[i+1]-top[1])+Math.abs(d[i+2]-top[2]);
      const push=p=>{if(!vis[p]&&dist(p*4)<=tol*1.6){vis[p]=1;q[t++]=p;}};
      for(let x=0;x<W;x++){push(x);push((H-1)*W+x);}for(let y=0;y<H;y++){push(y*W);push(y*W+W-1);}
      while(h<t){const p=q[h++];const x=p%W,y=(p/W)|0;if(x>0)push(p-1);if(x<W-1)push(p+1);if(y>0)push(p-W);if(y<H-1)push(p+W);}
      for(let p=0;p<W*H;p++)if(vis[p]){const i=p*4;const dd=dist(i);d[i+3]=dd<=tol?0:Math.round(255*Math.min(1,(dd-tol)/(tol*0.6+1)));}
      cx.putImageData(out,0,0);}
    let tm;const tolEl=$("#fTol");aplicar(40);tolEl.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>aplicar(Number(tolEl.value)),60);};
    const fin=(sin)=>{if(sin)aplicar(0);cv.toBlob(bl=>{root.innerHTML="";resolve(bl);},"image/png");};
    $("#fOk").onclick=()=>fin(false);$("#fSin").onclick=()=>fin(true);$("#fCancel").onclick=()=>{root.innerHTML="";resolve(null);};
  };img.src=url;});}

async function pintarPagina(){const tok=++RD.tok;const pg=await RD.doc.getPage(RD.page);if(tok!==RD.tok)return;const body=$("#rBody");
  const w=Math.max(200,Math.min(body.clientWidth-24,900));const v1=pg.getViewport({scale:1});const dpr=Math.min(2,window.devicePixelRatio||1);const vp=pg.getViewport({scale:w/v1.width*dpr});
  const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);c.style.width=Math.floor(vp.width/dpr)+"px";c.setAttribute("aria-label","Página "+RD.page);
  await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;if(tok!==RD.tok)return;body.innerHTML="";body.appendChild(c);body.scrollTop=0;navLector();}

function unirFamilia(code){fusionar(JSON.parse(decodeURIComponent(escape(atob(String(code).trim().replace(/^EPK1:/,""))))));}
function fusionar(j){
  if(!j||typeof j.lectores!=="object")throw 0;BIB.familia=BIB.familia&&BIB.familia.nombre?BIB.familia:(j.familia||{});
  for(const [n,o] of Object.entries(j.lectores)){if(!BIB.lectores[n]){BIB.lectores[n]=o;continue;}const L=perfil(n);
    for(const k of ["plan","leidos","cuentos","mats","museo","insignias","marcas","biblicos"])L[k]=Object.assign({},o[k]||{},L[k]);

const asisTimers={};
function marcar(claseId,ninoId,k){
  const a=JSON.parse(JSON.stringify(S.asistencia[claseId]||{}));
  const arr=new Set(a[k]||[]);arr.has(ninoId)?arr.delete(ninoId):arr.add(ninoId);a[k]=[...arr];
  if(k!=="presente"&&arr.has(ninoId)){const pr=new Set(a.presente||[]);pr.add(ninoId);a.presente=[...pr];}
  S.asistencia[claseId]=a;pendingAsis[claseId]=true;render();
  clearTimeout(asisTimers[claseId]);
  asisTimers[claseId]=setTimeout(()=>{
    const ref=db.collection("asistencia").doc(claseId);const body={};MARCAS.forEach(([kk])=>body[kk]=S.asistencia[claseId][kk]||[]);
    enqueue(ref.path,()=>ref.set(body)).then(()=>{pendingAsis[claseId]=false;}).catch(e=>{pendingAsis[claseId]=false;toast(errMsg(e));});
  },600);
}

    case "brMover":{const dd=Number(b.dataset.d);let li=BR.li,cap=BR.cap+dd;if(cap<1){li--;if(li<0)break;cap=LIBROS[li][1];}else if(cap>LIBROS[li][1]){li++;if(li>65)break;cap=1;}BR.li=li;BR.cap=cap;BR.sel.clear();window.scrollTo(0,0);cargarCap();break;}
    case "brLeido":{if(!lector()){toast("Crea tu perfil para guardar tu avance");formLector();break;}const k=LIBROS[BR.li][0]+" "+BR.cap;const L=lector();if(L.leidos[k]){delete L.leidos[k];bibSave();render();}else quienesLeyeron(ns=>acreditar("leidos",k,ns));break;}
    case "brMarca":{const L=lector();if(!L){toast("Crea tu perfil para marcar versículos");formLector();break;}const c=b.dataset.c;BR.sel.forEach(v=>{const key=CODES[BR.li]+"."+BR.cap+"."+v;if(c)L.marcas[key]=c;else delete L.marcas[key];});BR.sel.clear();bibSave();render();toast(c?"Versículo marcado":"Color quitado");break;}
    case "brFav":{const L=lector();if(!L){toast("Crea tu perfil para guardar favoritos");formLector();break;}L.favs.unshift({ref:refSel(),texto:textoSel(),color:"sun",fecha:hoyISO(),ver:VERS[BR.ver]});BR.sel.clear();bibSave();render();toast("Guardado en Mis versículos");revisarInsignias();break;}
    case "brCopiar":{const t=textoSel()+" ("+refSel()+", "+VERS[BR.ver]+")";try{await navigator.clipboard.writeText(t);toast("Copiado");}catch(err){toast("No se pudo copiar en este dispositivo");}break;}
    case "nuevoBiblico":if(!assets){toast("Solo maestros y administradores pueden agregar personajes");break;}formBiblico(null);break;
    case "editBiblico":formBiblico(find("biblicos"));break;
    case "verBiblico":{callar();ui.tab="biblia";ui.bib="biblicos";ui.biblico=id||null;if(id){const L=lector();if(L&&!L.biblicos[id]){L.biblicos[id]=hoyISO();bibSave();setTimeout(revisarInsignias,300);}}render();window.scrollTo(0,0);break;}
    case "claseSeg":ui.claseSeg=b.dataset.k;render();break;
    case "rec":ui.rec=b.dataset.k;render();break;
    case "subirCuentos":if(!assets){toast("Solo maestros y administradores pueden subir archivos");break;}$("#fileCuentos").click();break;
    case "cerrarProg":ui.progreso=null;render();break;
    case "editCuento":formCuento(find("cuentos"));break;
    case "bajar":descargar(b.dataset.asset,b.dataset.n,b);break;
    case "nuevoMaterial":formMaterial(b.dataset.col,null);break;
    case "editMaterial":{const col=b.dataset.col;formMaterial(col,S[col].find(x=>x.id===id));break;}
    case "marcar":marcar(b.dataset.clase,b.dataset.nino,b.dataset.k);break;
    case "canjear":{const p=S.premios.find(x=>x.id===id);const n=S.ninos.find(x=>x.id===b.dataset.nino);if(!p||!n)break;
      openForm({titulo:"Canjear "+p.nombre,ayuda:`Se descontarán ${Number(p.costo)||0} estrellas a ${n.nombre}.`,campos:[{k:"fecha",label:"Fecha de entrega",type:"date"}],datos:{fecha:hoyISO()},guardarTxt:"Canjear premio",
        onSave:async v=>{await guardar("bonos",null,{ninoId:n.id,pts:-(Number(p.costo)||0),motivo:"Canje: "+p.nombre,fecha:v.fecha||hoyISO()});}});break;}
    case "borrarBono":{if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="¿Quitar?";break;}try{await borrar("bonos",id);toast("Quitado");}catch(err){toast(errMsg(err));}break;}
    case "copiar":{const v=b.dataset.v;try{await navigator.clipboard.writeText(v);toast("Copiado");}catch(err){const s=b.previousElementSibling;if(s){const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);}toast("Texto seleccionado, cópialo manualmente");}break;}
  }
});
document.addEventListener("focusout",()=>{if(renderPend)setTimeout(()=>{if(renderPend)render();},50);});
window.EPKapp={render,toast,openForm,BIB:()=>BIB};
$("#menuBtn").onclick=()=>{if(window.EPK)EPK.abrirMenu();};
$("#perfilBtn").onclick=()=>{ui.tab="mas";ui.mas="familia";render();window.scrollTo(0,0);};
$("#rClose").onclick=cerrarLector;
$("#rPrev").onclick=()=>{if(RD.doc&&RD.page>1){RD.page--;pintarPagina();}};
$("#rNext").onclick=()=>{if(RD.doc&&RD.page<RD.total){RD.page++;pintarPagina();}};
$("#rDone").onclick=()=>{const f=RD.onDone;if(f)f();};
document.addEventListener("keydown",e=>{const t=e.target;if((e.key==="Enter"||e.key===" ")&&t.classList&&t.classList.contains("vs")){e.preventDefault();t.click();}});
document.addEventListener("keydown",e=>{if($("#reader").hidden)return;if(e.key==="Escape")cerrarLector();if(e.key==="ArrowRight")$("#rNext").hidden||$("#rNext").click();if(e.key==="ArrowLeft")$("#rPrev").hidden||$("#rPrev").click();});
$("#fileCuentos").addEventListener("change",e=>{const fs=[...e.target.files];e.target.value="";subirCuentos(fs);});
document.addEventListener("input",e=>{if(e.target.id==="bibVers"){selRef.vers=e.target.value.replace(/[^0-9-]/g,"");actualizarLinks();return;}if(e.target.id==="buscarCuento"){ui.buscar=e.target.value;const l=$("#listaCuentos");if(l)l.innerHTML=listaCuentosHTML();}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="brLibro"){BR.li=Number(t.value);BR.cap=1;BR.sel.clear();t.blur();cargarCap();return;}
  if(t.id==="brCap"){BR.cap=Number(t.value);BR.sel.clear();t.blur();cargarCap();return;}
  if(t.id==="brVer"){BR.ver=t.value;if(BR.cmp===BR.ver)BR.cmp="";t.blur();cargarCap();return;}
  if(t.id==="brCmp"){BR.cmp=t.value;t.blur();cargarCap();return;}
  if(t.id==="bibLibro"){selRef.libro=t.value;selRef.cap=1;selRef.vers="";t.blur();render();return;}
  if(t.id==="bibCap"){selRef.cap=Number(t.value);t.blur();render();return;}
  if(t.id==="libroSel"){ui.libroClase=t.value;t.blur();render();return;}
  if(t.dataset&&t.dataset.libro){const campo=t.dataset.libro;let v=t.value.trim();
    if(campo==="notas"&&v!==""){const n=Number(v.replace(",","."));if(!isFinite(n)||n<1||n>7){toast("La nota debe estar entre 1,0 y 7,0");const l=S.libro[t.dataset.clase];const o=l&&l.notas&&l.notas[t.dataset.nino];t.value=o!=null?fmtNota(o):"";return;}v=Math.round(n*10)/10;t.value=fmtNota(v);}
    setLibro(t.dataset.clase,t.dataset.nino,campo,v);}
});
$("#modeBtn").addEventListener("click",()=>{ui.familia=!ui.familia;try{localStorage.setItem("epk_familia",ui.familia?"1":"0");}catch(e){}render();toast(ui.familia?"Así ven la app las familias":"Vista de maestro");});

/* ---------- arranque ---------- */
render();
if(window.EPK&&EPK.user)EPK.cargarFamilia().then(r=>{if(r&&r.lectores){try{fusionar(r);}catch(e){}render();}else if(Object.keys(BIB.lectores).length)bibSave();});
setTimeout(()=>{if(!loaded.clases&&!dbFailed){dbFailed=true;render();}},12000);
(async()=>{
  try{
    if(!window.claude||!window.claude.use)throw new Error("sin runtime");
    const[d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    db=d;
    if(u){try{canEdit=!!(await u.canEdit());}catch(e){canEdit=false;}}
    if(!db){dbFailed=true;render();return;}
    Promise.all([window.claude.use("assets"),window.claude.use("downloads")]).then(([a,dl])=>{assets=canEdit?a:null;downloads=dl;if(ui.tab==="recursos"&&canEdit)refrescarUso();render();}).catch(()=>{});
    for(const c of COLS.concat(canEdit?COLS_EQUIPO:[])){
      db.collection(c).onSnapshot(snap=>{
        const arr=snap.docs.map(x=>({id:x.id,...x.data()}));
        if(c==="libro"){const keep={};for(const k in S.libro)if(pendingLibro[k])keep[k]=S.libro[k];S.libro={};arr.forEach(a=>S.libro[a.id]=a);Object.assign(S.libro,keep);}
        else if(c==="asistencia"){const keep={};for(const k in S.asistencia)if(pendingAsis[k])keep[k]=S.asistencia[k];S.asistencia={};arr.forEach(a=>S.asistencia[a.id]=a);Object.assign(S.asistencia,keep);}
        else if(c==="parabolas"&&!arr.length)S[c]=BASE.parabolas.slice();
        else S[c]=arr;
        loaded[c]=true;dbFailed=false;render();
      },err=>{console.warn(c,err);loaded[c]=true;render();});
    }
    db.doc("config/general").onSnapshot(d=>{S.config=d.exists?{...d.data()}:{};render();},()=>{});
  }catch(e){dbFailed=true;render();}
})();
})();};
</script>

<script src="cuentas.js"></script>
