<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel de Control · Eterno Pacto Kids</title>
<link rel="icon" href="img/icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: barra lateral de secciones (arriba en celular) + área de trabajo densa tipo consola */
:root{
  --bg:#F1F4FA; --surface:#FFFFFF; --sunk:#E9EEF7; --ink:#1A2240; --muted:#59627F; --line:#D9E0EE;
  --accent:#2B58C9; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --sun:#E9A912; --sun-soft:#FFF1CC; --sun-ink:#5A3F00;
  --leaf:#2F8A50; --leaf-soft:#DEF2E5; --rose:#C8443F; --rose-soft:#FBE3E2;
  --side:#16204a; --side-ink:#DCE3FA; --side-muted:#93A0CF;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1328; --surface:#181E3B; --sunk:#121731; --ink:#E7EBF8; --muted:#A3ACC8; --line:#2A3260;
  --accent:#86A5FF; --accent-ink:#0D1330; --accent-soft:#222C5A;
  --sun:#F4C451; --sun-soft:#3A3118; --sun-ink:#FBE2A0;
  --leaf:#6BCB8E; --leaf-soft:#173325; --rose:#FF8D88; --rose-soft:#3B1D22;
  --side:#0A0E20; --side-ink:#DCE3FA; --side-muted:#8390BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1328; --surface:#181E3B; --sunk:#121731; --ink:#E7EBF8; --muted:#A3ACC8; --line:#2A3260;
  --accent:#86A5FF; --accent-ink:#0D1330; --accent-soft:#222C5A;
  --sun:#F4C451; --sun-soft:#3A3118; --sun-ink:#FBE2A0;
  --leaf:#6BCB8E; --leaf-soft:#173325; --rose:#FF8D88; --rose-soft:#3B1D22;
  --side:#0A0E20; --side-ink:#DCE3FA; --side-muted:#8390BD; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:10px}
.side .brand img{width:56px;height:33px;border-radius:6px;object-fit:cover}
.side .brand b{font-family:var(--display);font-size:1.05rem;line-height:1.1;display:block}
.side .brand span{font-size:.75rem;color:var(--side-muted);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;color:var(--side-ink);text-align:left;padding:9px 12px;border-radius:10px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(134,165,255,.18);color:#fff}
.nav .cnt{color:var(--side-muted);font-weight:400;font-variant-numeric:tabular-nums}
.side .pie{margin-top:auto;font-size:.82rem;color:var(--side-muted);display:flex;flex-direction:column;gap:6px}
.side .pie a{color:var(--side-ink)}
.side .pie button{background:none;border:1px solid rgba(255,255,255,.2);color:var(--side-ink);border-radius:8px;padding:6px 10px;text-align:left}
main{padding:24px clamp(16px,3vw,36px) 60px;min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1280px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:1.7rem}
.muted{color:var(--muted)} .small{font-size:.86rem}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.15rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:0;border-radius:999px;padding:8px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--rose-soft);color:var(--rose)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn:disabled{opacity:.55;cursor:default}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)} .pill.warn{background:var(--sun-soft);color:var(--sun-ink)} .pill.bad{background:var(--rose-soft);color:var(--rose)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.9rem}
tr:last-child td{border-bottom:0}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--accent-soft)}
.search,.inp,select.inp,textarea.inp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
.search{width:min(340px,100%)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:700;font-size:.84rem}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{position:relative;height:150px;display:flex;align-items:flex-end;gap:2px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.cols .c i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.cols .c i.zero{background:var(--line)}
.cols .c span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.68rem;color:var(--muted);white-space:nowrap}
.cols .c:hover i{background:var(--sun)}
.cols .c .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:3px 8px;border-radius:6px;font-size:.75rem;white-space:nowrap;z-index:2}
.cols .c:hover .tip,.cols .c:focus .tip{display:block}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.prog{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--leaf)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:0;align-self:flex-start}
.danger-zone{border-color:var(--rose)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#2B58C9,#16204a)}
.gate .card{max-width:400px;width:100%}
.empty{border:2px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--sunk);border-radius:6px;padding:2px 6px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:5;padding:10px 12px;gap:8px;flex-direction:column}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;padding:7px 10px}
  .side .pie{display:none}
}
</style>
</head>
<body>
<div id="gate" class="gate" hidden></div>
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><img src="img/logo.jpg" alt="" width="56" height="33"><div><b>Panel de Control</b><span>Eterno Pacto Kids</span></div></div>
    <nav class="nav" id="nav" aria-label="Secciones del panel"></nav>
    <div class="pie"><span id="quien"></span><a href="/">Ir a la app</a><button id="recargar">Actualizar datos</button><button id="salir">Cerrar sesión</button></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="panel.js"></script>
</body>
</html>
